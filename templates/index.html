
<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TK Myanmar Clip AI</title>
  <style>
    body {
      font-family: sans-serif;
      background: #101827;
      color: white;
      padding: 20px;
      margin: 0;
    }
    .card {
      max-width: 520px;
      margin: 25px auto;
      padding: 22px;
      background: #1e293b;
      border-radius: 16px;
    }
    h2 { text-align: center; }
    label { display: block; margin-top: 18px; }
    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 8px;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      background: #16a34a;
      color: white;
      border: 0;
      font-weight: bold;
      margin-top: 22px;
    }
    button:disabled { opacity: 0.6; }
    #status {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin-top: 16px;
    }
    .hint { color: #cbd5e1; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎬 TK Myanmar Clip AI</h2>
    <p>ဗီဒီယိုတင်ပါ။ အသံမှစာသားကို အလိုအလျောက်ထုတ်ပြီး မြန်မာစာတန်းထိုးပေးပါမယ်။</p>

    <form id="form">
      <label for="video">ဗီဒီယိုဖိုင် ရွေးပါ</label>
      <input id="video" name="video" type="file"
             accept="video/*" required>

      <p class="hint">အသံပါသော ဗီဒီယိုတိုတစ်ခုဖြင့် အရင်စမ်းပါ။</p>

      <label for="aspect">ဗီဒီယိုအချိုး</label>
      <select id="aspect" name="aspect">
        <option value="9:16">9:16 — TikTok / Reels</option>
        <option value="16:9">16:9 — YouTube</option>
      </select>

      <button id="submit" type="submit">
        စာတန်းထိုးပြီး ဖိုင်ရယူမည်
      </button>
    </form>

    <div id="status" role="status"></div>
  </div>

  <script>
    const form = document.getElementById("form");
    const button = document.getElementById("submit");
    const status = document.getElementById("status");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      button.disabled = true;
      status.textContent = "လုပ်ဆောင်နေပါပြီ။ ခဏစောင့်ပေးပါ...";

      try {
        const response = await fetch("/create", {
          method: "POST",
          body: new FormData(form)
        });

        if (!response.ok) {
          let message = "ဖိုင်ဖန်တီးမရပါ။ Render Logs ကို စစ်ပါ။";
          try {
            const data = await response.json();
            if (data.error) message = data.error;
          } catch (_) {}
          throw new Error(message);
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "TK_Myanmar_Clip_AI.zip";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);

        status.textContent =
          "ပြီးပါပြီ။ ZIP ဖိုင်ထဲမှာ ဗီဒီယိုနဲ့ SRT စာတန်းဖိုင် ပါဝင်ပါတယ်။";
      } catch (error) {
        status.textContent = "အမှား: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
